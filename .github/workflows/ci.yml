name: Go CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - run: go mod download

      - run: go vet ./...

      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      - run: go test ./...
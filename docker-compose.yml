services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    container_name: task-api
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: task_management
      DB_SSLMODE: disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD:
      REDIS_DB: 0
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: task-worker
    environment:
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD:
      REDIS_DB: 0
    depends_on:
      - redis

  postgres:
    image: postgres:16
    container_name: task-management-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: task_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: task_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: